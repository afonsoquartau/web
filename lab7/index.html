<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja Online</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Loja Online</h1>
        <p>Encontra aqui os teus produtos favoritos!</p>

        <nav aria-label="Navegação principal">
            <a href="#produtos">Produtos</a>
            <a href="#cesto">Cesto</a>
        </nav>
    </header>

    <main>
        <section id="produtos">
            <h2>Os nossos produtos</h2>
            <div class="lista-produtos"></div>
        </section>

        <section id="cesto">
            <h2>Cesto de compras</h2>
            <div class="lista-cesto"></div>
            <p class="total">Total: <span id="valor-total">0,00 €</span></p>
        </section>
    </main>

    <footer>
        <p>Loja Online - DIW 2026/27</p>
    </footer>

    <script src="produtos.js"></script>
    <script src="main.js"></script>
</body>
</html>
